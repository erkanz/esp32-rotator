name: F09 F10 SDR Scanner Windows
on:
  push:
    branches: [main]
    paths:
      - 'sdr_scan/**'
      - '.github/workflows/f09-f10-sdr-scan.yml'
      - 'windows_app/pin_pairing.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-sdr:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanner requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows_app/requirements.txt numpy
      - name: Python syntax
        run: python -m compileall -q sdr_scan
      - name: Scanner regression tests
        run: python -m unittest discover -s sdr_scan -p "test_*.py" -v
      - name: No-hardware demo smoke test
        run: python sdr_scan/rotator_scan.py --source demo --start 120 --stop 150 --step 10 --settle 0.01 --dwell 0.5 --move-timeout 2 --min-snr 0 --csv demo.csv
      - name: Build Windows console EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --name RotatorSDRScanner --paths windows_app --hidden-import pin_pairing --collect-all bleak sdr_scan/rotator_scan.py
      - name: Check Windows output
        shell: pwsh
        run: |
          if (!(Test-Path "dist/RotatorSDRScanner.exe")) { throw "EXE missing" }
          Get-Item "dist/RotatorSDRScanner.exe" | Select-Object Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: RotatorSDRScanner-Windows-EXE
          path: dist/RotatorSDRScanner.exe
          if-no-files-found: error
          retention-days: 14
